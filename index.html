<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Digit Challenge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background: #0a0a2e;
            color: #e0e0ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        #game-container {
            text-align: center;
            max-width: 700px;
            width: 90%;
            position: relative;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.25rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 2rem;
        }

        #pi-symbol {
            font-size: 6rem;
            margin: 0.5rem 0;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #start-btn {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.3rem;
            padding: 14px 48px;
            border: 2px solid #667eea;
            background: transparent;
            color: #667eea;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            margin: 1.5rem 0;
        }

        #start-btn:hover {
            background: #667eea;
            color: #0a0a2e;
        }

        #play-area {
            display: none;
        }

        #digit-display {
            font-size: 2.8rem;
            letter-spacing: 4px;
            min-height: 60px;
            margin: 1rem 0;
            word-break: break-all;
            line-height: 1.4;
            padding: 0 10px;
        }

        #digit-display .correct {
            color: #4ade80;
        }

        #digit-display .cursor {
            color: #667eea;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        #stats-bar {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            margin: 1.5rem 0;
            font-size: 1rem;
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #667eea;
        }

        #timer-bar {
            width: 100%;
            height: 4px;
            background: #1a1a4e;
            border-radius: 2px;
            margin: 1rem 0;
            overflow: hidden;
        }

        #timer-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #667eea);
            border-radius: 2px;
            width: 100%;
            transition: width 0.1s linear, background 0.3s;
        }

        #timer-fill.warning {
            background: linear-gradient(90deg, #f59e0b, #ef4444);
        }

        /* Game Over screen */
        #game-over {
            display: none;
        }

        #game-over h2 {
            font-size: 2rem;
            color: #ef4444;
            margin-bottom: 0.5rem;
        }

        #game-over.perfect h2 {
            color: #4ade80;
        }

        #final-score {
            font-size: 4rem;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0.5rem 0;
        }

        #final-details {
            color: #888;
            margin-bottom: 1rem;
            line-height: 1.8;
        }

        #wrong-digit-info {
            background: #1a1a3e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px 20px;
            margin: 1rem auto;
            max-width: 400px;
            font-size: 0.9rem;
        }

        #wrong-digit-info .you-typed {
            color: #ef4444;
        }

        #wrong-digit-info .expected {
            color: #4ade80;
        }

        #new-high-score {
            display: none;
            color: #f59e0b;
            font-size: 1.2rem;
            font-weight: bold;
            margin: 0.5rem 0;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* High scores */
        #high-scores {
            margin-top: 1.5rem;
            border-top: 1px solid #1a1a4e;
            padding-top: 1rem;
        }

        #high-scores h3 {
            color: #667eea;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .score-entry {
            display: flex;
            justify-content: space-between;
            padding: 6px 20px;
            font-size: 0.85rem;
            color: #aaa;
        }

        .score-entry:nth-child(odd) {
            background: rgba(255, 255, 255, 0.02);
        }

        .score-entry .rank {
            color: #667eea;
            width: 30px;
            text-align: left;
        }

        .score-entry .score-digits {
            flex: 1;
            text-align: center;
        }

        .score-entry .score-time {
            width: 80px;
            text-align: right;
        }

        .score-entry.highlight {
            color: #f59e0b;
            font-weight: bold;
        }

        /* Anti-cheat overlay */
        #blur-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 46, 0.97);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        #blur-overlay p {
            font-size: 1.5rem;
            color: #ef4444;
            margin-bottom: 1rem;
        }

        #blur-overlay .sub {
            font-size: 0.9rem;
            color: #888;
        }

        /* Per-digit timeout indicator */
        #digit-timeout-label {
            font-size: 0.7rem;
            color: #666;
            margin-top: 2px;
        }

        /* Hidden input for mobile keyboard */
        #hidden-input {
            position: absolute;
            left: -9999px;
            top: -9999px;
            opacity: 0;
            width: 1px;
            height: 1px;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.6rem; }
            #pi-symbol { font-size: 4rem; }
            #digit-display { font-size: 2rem; }
            .stat-value { font-size: 1.4rem; }
            #final-score { font-size: 3rem; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Start Screen -->
        <div id="start-screen">
            <h1>Pi Digit Challenge</h1>
            <p class="subtitle">How many digits of &pi; can you type from memory?</p>
            <div id="pi-symbol">&pi;</div>
            <div>
                <button id="start-btn">Start</button>
            </div>
            <div id="high-scores-start"></div>
        </div>

        <!-- Play Area -->
        <div id="play-area">
            <div id="stats-bar">
                <div class="stat">
                    <span class="stat-label">Digits</span>
                    <span class="stat-value" id="digit-count">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Time</span>
                    <span class="stat-value" id="elapsed-time">0.0s</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Per Digit</span>
                    <span class="stat-value" id="per-digit-time">-</span>
                </div>
            </div>
            <div id="timer-bar"><div id="timer-fill"></div></div>
            <div id="digit-timeout-label">Type the next digit within 15 seconds</div>
            <div id="digit-display">
                <span class="correct">3.</span><span class="cursor">_</span>
            </div>
            <input id="hidden-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </div>

        <!-- Game Over -->
        <div id="game-over">
            <h2>Game Over</h2>
            <div id="final-score">0</div>
            <div>digits after the decimal</div>
            <div id="new-high-score">NEW HIGH SCORE!</div>
            <div id="final-details"></div>
            <div id="wrong-digit-info"></div>
            <button id="start-btn-2" style="font-family: 'Courier New', Courier, monospace;
                font-size: 1.1rem; padding: 12px 40px; border: 2px solid #667eea;
                background: transparent; color: #667eea; cursor: pointer;
                border-radius: 8px; margin: 1rem 0; transition: all 0.2s;">
                Try Again
            </button>
            <div id="high-scores-end"></div>
        </div>
    </div>

    <!-- Blur overlay for tab switching -->
    <div id="blur-overlay">
        <p>Focus lost — Game Over!</p>
        <p class="sub">Switching tabs or windows ends your run.</p>
    </div>

    <script>
        // Pi digits (1000 digits after decimal point)
        const PI_DIGITS = "1415926535897932384626433832795028841971693993751058209749445923078164062862089986280348253421170679821480865132823066470938446095505822317253594081284811174502841027019385211055596446229489549303819644288109756659334461284756482337867831652712019091456485669234603486104543266482133936072602491412737245870066063155881748815209209628292540917153643678925903600113305305488204665213841469519415116094330572703657595919530921861173819326117931051185480744623799627495673518857527248912279381830119491298336733624406566430860213949463952247371907021798609437027705392171762931767523846748184676694051320005681271452635608277857713427577896091736371787214684409012249534301465495853710507922796892589235420199561121290219608640344181598136297747713099605187072113499999983729780499510597317328160963185950244594553469083026425223082533446850352619311881710100031378387528865875332083814206171776691473035982534904287554687311595628638823537875937519577818577805321712268066130019278766111959092164201989";

        const PER_DIGIT_TIMEOUT = 15000; // 15 seconds per digit

        let gameState = {
            active: false,
            digitsTyped: 0,
            startTime: null,
            lastDigitTime: null,
            digitTimer: null,
            elapsed: 0,
            timerInterval: null,
            tabSwitched: false,
        };

        // DOM elements
        const startScreen = document.getElementById("start-screen");
        const playArea = document.getElementById("play-area");
        const gameOverScreen = document.getElementById("game-over");
        const digitDisplay = document.getElementById("digit-display");
        const digitCount = document.getElementById("digit-count");
        const elapsedTime = document.getElementById("elapsed-time");
        const perDigitTime = document.getElementById("per-digit-time");
        const timerFill = document.getElementById("timer-fill");
        const blurOverlay = document.getElementById("blur-overlay");
        const startBtn = document.getElementById("start-btn");
        const startBtn2 = document.getElementById("start-btn-2");
        const hiddenInput = document.getElementById("hidden-input");

        // ---- Anti-cheat measures ----

        // Block paste everywhere
        document.addEventListener("paste", e => { e.preventDefault(); });

        // Block context menu
        document.addEventListener("contextmenu", e => { e.preventDefault(); });

        // Block drag and drop
        document.addEventListener("drop", e => { e.preventDefault(); });
        document.addEventListener("dragover", e => { e.preventDefault(); });

        // Track whether keydown already handled the input to avoid double-fire
        let handledByKeydown = false;

        // Block key combos for paste / inspect
        document.addEventListener("keydown", e => {
            // Block Ctrl/Cmd+V (paste)
            if ((e.ctrlKey || e.metaKey) && e.key === "v") { e.preventDefault(); return; }
            // Block Ctrl/Cmd+Shift+V
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === "V") { e.preventDefault(); return; }
            // Block Ctrl/Cmd+A (select all)
            if ((e.ctrlKey || e.metaKey) && e.key === "a") { e.preventDefault(); return; }

            if (!gameState.active) return;

            // Only accept digit keys
            if (e.key >= "0" && e.key <= "9") {
                handledByKeydown = true;
                handleDigitInput(e.key);
            }
        });

        // Hidden input anti-cheat (for mobile)
        hiddenInput.addEventListener("paste", e => { e.preventDefault(); });
        hiddenInput.addEventListener("input", e => {
            const val = hiddenInput.value;
            hiddenInput.value = "";

            // If keydown already handled this keystroke, skip
            if (handledByKeydown) {
                handledByKeydown = false;
                return;
            }

            if (!gameState.active) return;
            if (val.length === 1 && val >= "0" && val <= "9") {
                handleDigitInput(val);
            } else if (val.length > 1) {
                // Multi-char input = paste attempt or autocomplete; end game
                endGame(true);
            }
        });

        // Tab / window focus detection
        document.addEventListener("visibilitychange", () => {
            if (gameState.active && document.hidden) {
                gameState.tabSwitched = true;
                endGame(true);
                blurOverlay.style.display = "flex";
                setTimeout(() => { blurOverlay.style.display = "none"; }, 3000);
            }
        });

        window.addEventListener("blur", () => {
            if (gameState.active) {
                gameState.tabSwitched = true;
                endGame(true);
                blurOverlay.style.display = "flex";
                setTimeout(() => { blurOverlay.style.display = "none"; }, 3000);
            }
        });

        // ---- Game logic ----

        function startGame() {
            gameState = {
                active: true,
                digitsTyped: 0,
                startTime: Date.now(),
                lastDigitTime: Date.now(),
                digitTimer: null,
                elapsed: 0,
                timerInterval: null,
                tabSwitched: false,
            };

            startScreen.style.display = "none";
            gameOverScreen.style.display = "none";
            playArea.style.display = "block";

            digitCount.textContent = "0";
            elapsedTime.textContent = "0.0s";
            perDigitTime.textContent = "-";
            timerFill.style.width = "100%";
            timerFill.classList.remove("warning");

            updateDisplay();
            startElapsedTimer();
            resetDigitTimer();

            // Focus hidden input for mobile
            hiddenInput.focus();
        }

        function handleDigitInput(digit) {
            if (!gameState.active) return;

            const expected = PI_DIGITS[gameState.digitsTyped];

            if (digit === expected) {
                gameState.digitsTyped++;
                gameState.lastDigitTime = Date.now();
                digitCount.textContent = gameState.digitsTyped;

                const avg = ((Date.now() - gameState.startTime) / 1000 / gameState.digitsTyped).toFixed(1);
                perDigitTime.textContent = avg + "s";

                updateDisplay();
                resetDigitTimer();

                if (gameState.digitsTyped >= PI_DIGITS.length) {
                    endGame(false, true); // completed all digits!
                }
            } else {
                endGame(false, false, digit, expected);
            }
        }

        function updateDisplay() {
            const typed = PI_DIGITS.substring(0, gameState.digitsTyped);
            // Show "3." prefix + typed digits + cursor
            let html = '<span class="correct">3.' + typed + '</span>';
            html += '<span class="cursor">_</span>';
            digitDisplay.innerHTML = html;
        }

        function startElapsedTimer() {
            gameState.timerInterval = setInterval(() => {
                if (!gameState.active) return;
                gameState.elapsed = (Date.now() - gameState.startTime) / 1000;
                elapsedTime.textContent = gameState.elapsed.toFixed(1) + "s";
            }, 100);
        }

        function resetDigitTimer() {
            if (gameState.digitTimer) clearInterval(gameState.digitTimer);

            const digitStart = Date.now();
            timerFill.style.width = "100%";
            timerFill.classList.remove("warning");

            gameState.digitTimer = setInterval(() => {
                if (!gameState.active) return;
                const remaining = PER_DIGIT_TIMEOUT - (Date.now() - digitStart);
                const pct = Math.max(0, (remaining / PER_DIGIT_TIMEOUT) * 100);
                timerFill.style.width = pct + "%";

                if (pct < 33) {
                    timerFill.classList.add("warning");
                } else {
                    timerFill.classList.remove("warning");
                }

                if (remaining <= 0) {
                    endGame(false, false, "timeout");
                }
            }, 50);
        }

        function endGame(tabSwitch = false, allComplete = false, wrongDigit = null, expectedDigit = null) {
            gameState.active = false;
            clearInterval(gameState.timerInterval);
            clearInterval(gameState.digitTimer);

            const totalTime = ((Date.now() - gameState.startTime) / 1000).toFixed(1);
            const digits = gameState.digitsTyped;

            playArea.style.display = "none";
            gameOverScreen.style.display = "block";

            const gameOverTitle = gameOverScreen.querySelector("h2");
            const finalScore = document.getElementById("final-score");
            const finalDetails = document.getElementById("final-details");
            const wrongInfo = document.getElementById("wrong-digit-info");
            const newHighScore = document.getElementById("new-high-score");

            finalScore.textContent = digits;

            if (allComplete) {
                gameOverTitle.textContent = "Incredible!";
                gameOverScreen.classList.add("perfect");
                finalDetails.innerHTML = `You typed all ${PI_DIGITS.length} digits in ${totalTime}s!`;
                wrongInfo.innerHTML = "";
            } else if (tabSwitch) {
                gameOverTitle.textContent = "Cheater?";
                gameOverScreen.classList.remove("perfect");
                finalDetails.innerHTML = `You left the page after ${digits} digit${digits !== 1 ? "s" : ""} (${totalTime}s).<br>Stay focused!`;
                wrongInfo.innerHTML = "";
            } else if (wrongDigit === "timeout") {
                gameOverTitle.textContent = "Too Slow!";
                gameOverScreen.classList.remove("perfect");
                finalDetails.innerHTML = `Timed out after ${digits} digit${digits !== 1 ? "s" : ""} (${totalTime}s).<br>You have ${PER_DIGIT_TIMEOUT / 1000}s per digit.`;
                wrongInfo.innerHTML = `Next expected digit: <span class="expected">${PI_DIGITS[digits]}</span>`;
            } else {
                gameOverTitle.textContent = "Wrong!";
                gameOverScreen.classList.remove("perfect");
                const avgTime = digits > 0 ? (totalTime / digits).toFixed(1) : "-";
                finalDetails.innerHTML = `${digits} digit${digits !== 1 ? "s" : ""} in ${totalTime}s (avg ${avgTime}s/digit)`;
                wrongInfo.innerHTML = `You typed <span class="you-typed">${wrongDigit}</span> — expected <span class="expected">${expectedDigit}</span> at position ${digits + 1}`;
            }

            // Check high score
            const isNew = saveScore(digits, parseFloat(totalTime));
            newHighScore.style.display = isNew ? "block" : "none";

            renderHighScores(document.getElementById("high-scores-end"));
        }

        // ---- High Scores (localStorage) ----

        function getScores() {
            try {
                return JSON.parse(localStorage.getItem("pi-highscores") || "[]");
            } catch {
                return [];
            }
        }

        function saveScore(digits, time) {
            const scores = getScores();
            const entry = { digits, time, date: new Date().toLocaleDateString() };
            scores.push(entry);
            // Sort: most digits first, then fastest time
            scores.sort((a, b) => b.digits - a.digits || a.time - b.time);
            // Keep top 10
            const top = scores.slice(0, 10);
            localStorage.setItem("pi-highscores", JSON.stringify(top));
            // Is this the new #1?
            return top[0].digits === digits && top[0].time === time;
        }

        function renderHighScores(container) {
            const scores = getScores();
            if (scores.length === 0) {
                container.innerHTML = "";
                return;
            }
            let html = '<div id="high-scores"><h3>High Scores</h3>';
            scores.forEach((s, i) => {
                html += `<div class="score-entry">
                    <span class="rank">#${i + 1}</span>
                    <span class="score-digits">${s.digits} digit${s.digits !== 1 ? "s" : ""}</span>
                    <span class="score-time">${s.time}s</span>
                </div>`;
            });
            html += "</div>";
            container.innerHTML = html;
        }

        // ---- Init ----

        startBtn.addEventListener("click", startGame);
        startBtn2.addEventListener("click", startGame);

        // Render initial high scores on start screen
        renderHighScores(document.getElementById("high-scores-start"));

        // Keep focus on hidden input for mobile
        document.addEventListener("click", () => {
            if (gameState.active) hiddenInput.focus();
        });
    </script>
</body>
</html>
